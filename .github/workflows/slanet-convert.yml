name: slanet-convert

# 把 PaddleOCR 的表格結構模型（SLANet）轉成 onnxruntime-web 載得進來的 ONNX。
#
# 為什麼要在 Linux 跑：本機 macOS + paddle2onnx 2.1 轉出來的圖不合法
# （無效的純量 Concat／含 Loop 子圖，onnxruntime-web 會拒絕）。
# 這個 workflow 在 ubuntu-latest 上試兩套工具鏈，成功的那組會上傳 artifact；
# 拿到之後放進 pic-calculator/static/models/ 就可以開 worker 的「結構模式」。
on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 版本是照 PyPI 上「真的有 wheel」的組合挑的（2026-11-12 查）：
      #   paddle2onnx 1.0.6／1.0.9 沒有 cp311 wheel（1.0.6 只到 cp310）→ 在 py3.11 必然安裝失敗
      #   paddle2onnx 1.0.8 有 cp311 manylinux_x86_64 → 這是「1.0.x 轉得乾淨」那條路
      #   paddle2onnx 2.1.0 支援到 cp312，但 macOS 實測轉出來含 Loop（對照組）
      matrix:
        include:
          - paddle: "2.6.2"
            p2o: "1.0.8"
            py: "3.11"
            label: paddle2onnx-1.0.8
          # 1.0.5 的 cp311 wheel 只有 aarch64 版，x86_64 的 py3.11 裝不到（pip 直接回 no matching
          # distribution）→ 同一個 1.0.8 改在 py3.10 再跑一次，確認不是 python 版本的問題
          - paddle: "2.6.2"
            p2o: "1.0.8"
            py: "3.10"
            label: paddle2onnx-1.0.8-py310
          - paddle: "3.0.0"
            p2o: "2.1.0"
            py: "3.12"
            label: paddle2onnx-2.1.0
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}

      - name: 安裝 ${{ matrix.label }}
        run: |
          python -m pip install --upgrade pip
          # paddle 2.6 需要 six（新一點的 pip 不會自動帶），paddle 3.x 需要 setuptools
          # 才有 pkg_resources —— 少了這兩個，import paddle 會直接 ModuleNotFoundError
          pip install "paddlepaddle==${{ matrix.paddle }}" "paddle2onnx==${{ matrix.p2o }}" \
                      onnx onnxruntime pillow numpy six setuptools protobuf

      - name: 轉檔並驗收（3×4→15 格、4×4→20 格、不含 Loop）
        run: |
          # set -o pipefail 是必要的：少了它，`python ... | tee` 的結束碼是 tee 的 0，
          # 轉檔失敗的工作照樣綠燈，然後上傳步驟才說「找不到檔案」（實測踩過）
          set -o pipefail
          python bench/experiments/convert_slanet.py \
            --out slanet_plus_${{ matrix.label }}.onnx \
            --workdir /tmp/slanet_convert | tee convert.log

      - name: 記錄結果
        if: always()
        run: |
          {
            echo "## SLANet 轉檔（${{ matrix.label }}）"
            echo '```'
            tail -20 convert.log || echo "沒有輸出"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: 上傳 ONNX
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: slanet-onnx-${{ matrix.label }}
          path: slanet_plus_*.onnx
          if-no-files-found: ignore

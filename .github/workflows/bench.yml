name: bench

# 真 OCR 的準確率量測：會下載 30MB 模型、開瀏覽器跑 6 張表，約 3–6 分鐘。
# 刻意「不阻擋」：這是報表不是布林值，而且模型／CDN 抖一下就會失敗。
# 結果會寫進 job summary，並把 run.json 留成 artifact。
on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * 0"   # 每週日 20:00 UTC（台北週一 04:00）

jobs:
  accuracy:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安裝 Playwright 與 Chromium
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i playwright --silent
          npx playwright install --with-deps chromium

      - name: 啟動本機靜態伺服器
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory pic-calculator/static &
          sleep 2
          curl -sf -o /dev/null http://127.0.0.1:8765/index.html

      - name: 跑辨識並比對標準答案
        run: |
          node bench/run_ocr.js --quality=small --out=out/run.json
          node bench/compare.js out/run.json

      - name: 留下量測結果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-run
          path: out/run.json
          if-no-files-found: ignore
